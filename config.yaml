# Root configuration for all services
environment: "development"
region: "us-west-1"
project: "flowpilotx"

# FlowPilot Gateway Service Configuration
flowpilotx_gateway:
  service:
    name: "flowpilotx-gateway"
    version: "1.0.0"
    environment: "development"
  
  server:
    host: "0.0.0.0"
    port: 8080
    shutdown_timeout: "30s"
    read_timeout: "15s"
    write_timeout: "15s"
    idle_timeout: "60s"
  
  websocket:
    path: "/ws/flowpilotx-gateway"
    read_buffer_size: 1024
    write_buffer_size: 1024
    handshake_timeout: "10s"
    ping_interval: "30s"
    pong_wait: "60s"
  
  api:
    version: "v1"
    base_path: "/api/flowpilotx-gateway"
    health_check_path: "/health"
    version_path: "/version"
  
  cors:
    allowed_origins:
      - "*"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
    max_age: 300
  
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 50
  
  temporal:
    host_port: "localhost:7233"
    namespace: "default"
    task_queue: "flowpilotx-task-queue"
    client:
      connection_timeout: "5s"
      rpc_timeout: "10s"
      rpc_long_poll_timeout: "20s"
      rpc_query_timeout: "10s"
      max_retry_attempts: 3
      initial_interval: "1s"
      max_interval: "10s"
      backoff_coefficient: 2.0
      identity: "flowpilotx-gateway"
    workflow:
      execution_timeout: "30m"
      run_timeout: "30m"
      task_timeout: "300s"
      workflow_id_reuse_policy: "AllowDuplicate"
      retry_policy:
        initial_interval: "1s"
        max_interval: "10s"
        max_attempts: 3
        backoff_coefficient: 2.0
        non_retryable_error_types:
          - "InvalidArgument"
          - "NotFound"

# FlowPilot Worker Service Configuration
flowpilotx_worker:
  service:
    name: "flowpilotx-worker"
    version: "1.0.0"
    environment: "development"
  
  server:
    host: "0.0.0.0"
    port: 50051
    shutdown_timeout: "30s"
    keepalive_time: "60s"
    keepalive_timeout: "20s"
    max_connection_idle: "180s"
  
  worker:
    # Workflow queues configuration
    # These queues are used for workflow task processing
    workflow_queues:
      # Default queue for standard workflow processing
      - queue_name: "flowpilotx-default-queue"
        max_concurrent_activity_execution_size: 100  # Maximum number of concurrent activities
        max_concurrent_workflow_execution_size: 50   # Maximum number of concurrent workflows
        worker_activities_per_second: 100           # Rate limit for worker activities
        task_queue_activities_per_second: 100       # Rate limit for task queue
        weight: 1                                   # Queue weight for load balancing

      # High priority queue for urgent workflows
      - queue_name: "flowpilotx-high-priority-queue"
        max_concurrent_activity_execution_size: 200  # Higher concurrency for priority tasks
        max_concurrent_workflow_execution_size: 100  # Double the default workflow capacity
        worker_activities_per_second: 200           # Higher throughput for priority tasks
        task_queue_activities_per_second: 200       # Higher queue processing rate
        weight: 2                                   # Higher weight for priority routing

      # Low priority queue for background workflows
      - queue_name: "flowpilotx-low-priority-queue"
        max_concurrent_activity_execution_size: 50   # Lower concurrency for background tasks
        max_concurrent_workflow_execution_size: 25   # Half the default workflow capacity
        worker_activities_per_second: 50            # Lower throughput for background tasks
        task_queue_activities_per_second: 50        # Lower queue processing rate
        weight: 1                                   # Standard weight for background tasks

    # Activity queues configuration
    # These queues are dedicated to specific activity types
    activity_queues:
      # Queue for addition operations
      
    # Worker heartbeat configuration
    heartbeat_interval: 30  # Interval in seconds for worker health checks
    
    # Queue management strategy configuration
    queue_balancing_strategy: "least_loaded"  # Strategy for distributing work across queues
                                            # Options: least_loaded, round_robin, weighted
    worker_startup_delay: "5s"              # Delay between starting each worker
    graceful_shutdown_time: "30s"           # Time allowed for graceful shutdown
    queue_rebalance_interval: "5m"          # How often to rebalance queues
    
    # Health check configuration for worker monitoring
    health_check:
      enabled: true                         # Enable/disable health checks
      interval: "30s"                       # How often to perform health checks
      timeout: "5s"                         # Maximum time for health check
      failure_threshold: 3                  # Number of failures before marking unhealthy
      success_threshold: 1                  # Number of successes before marking healthy

# Shared MongoDB configuration
mongodb:
  uri: "mongodb://localhost:27017"
  database: "flowpilotx"
  username: "subratasuperadmin"
  password: "password123"
  options:
    max_pool_size: 100
    min_pool_size: 10
    max_idle_time_ms: 30000
    connect_timeout_ms: 5000
    socket_timeout_ms: 10000
    server_selection_timeout_ms: 5000
    retry_writes: true
    retry_reads: true
  collections:
    # Worker collections
    worker_tasks: 
      indexes:
        - keys: ["status", "created_at", "updated_at"]
          options: { background: true }
    worker_executions:
      indexes:
        - keys: ["task_id", "status", "start_time"]
          options: { background: true }
    worker_events: {}
    # Gateway collections
    workflows:
      indexes:
        - keys: ["_id"]
          options: { unique: true }
    workflow_requests:
      indexes:
        - keys: ["_id", "workflow_id"]
          options: { unique: true }
    activity_results:
      indexes:
        - keys: ["_id", "request_id"]
          options: { unique: true }
    gateway_logs: {}
    # Add other service collections here
    workflow_tasks: {}
    workflow_executions: {}

# Shared metrics configuration
metrics:
  enabled: true
  host: "0.0.0.0"
  port: 9090

# Shared logging configuration
logging:
  level: "info"
  format: "text"
  output_path: "stdout"

# Default server settings
server:
  host: "0.0.0.0"
  shutdown_timeout: "30s"
  keepalive_time: "60s"
  keepalive_timeout: "20s"
  max_connection_idle: "180s"

# Service ports mapping
service_ports:
  worker: 50051
  gateway: 50052
  workflow_manager: 50053
  tools: 50054

# Activity Configuration
flowpilotx_activities:
  activities:
    - name: "Add"
      type: "calculator"
      queue: "flowpilotx-add-queue"
      retry_count: 3
      timeout_seconds: 30
      description: "Add two numbers"
      
    - name: "Multiply"
      type: "calculator"
      queue: "flowpilotx-multiply-queue"
      retry_count: 3
      timeout_seconds: 30
      description: "Multiply two numbers"
      
    