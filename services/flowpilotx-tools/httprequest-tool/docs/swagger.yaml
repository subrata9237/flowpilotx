host: localhost:8080
info:
  contact: {}
  description: A service for handling HTTP requests
  title: HTTP Request Tool API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Get the health status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service health
      tags:
      - health
  /process:
    post:
      consumes:
      - application/json
      description: Process an HTTP request with the given parameters
      parameters:
      - description: HTTP request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.HTTPRequest'
      produces:
      - application/json
      - application/xml
      - text/plain
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Process HTTP request
      tags:
      - request
  /process/async:
    post:
      consumes:
      - application/json
      description: Process an HTTP request asynchronously and return a request ID
      parameters:
      - description: HTTP request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.HTTPRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Process HTTP request asynchronously
      tags:
      - request
  /process/batch:
    post:
      consumes:
      - application/json
      description: Process multiple HTTP requests in batch
      parameters:
      - description: Array of HTTP request parameters
        in: body
        name: requests
        required: true
        schema:
          items:
            $ref: '#/definitions/model.HTTPRequest'
          type: array
      produces:
      - application/json
      - application/xml
      - text/plain
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.HTTPResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Process multiple HTTP requests
      tags:
      - request
swagger: "2.0"
