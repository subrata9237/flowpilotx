apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-web
  labels:
    app: temporal-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-web
  template:
    metadata:
      labels:
        app: temporal-web
    spec:
      containers:
        - name: temporal-web
          image: temporalio/web:1.15.0
          env:
            - name: TEMPORAL_GRPC_ENDPOINT
              value: "temporal:7233"
            - name: TEMPORAL_PERMIT_WRITE_API
              value: "true"
          ports:
            - containerPort: 8088