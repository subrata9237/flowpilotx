apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-wf-storage
spec:
  serviceName: "mongo-wf-storage"
  replicas: 1
  selector:
    matchLabels:
      app: mongo-wf-storage
  template:
    metadata:
      labels:
        app: mongo-wf-storage
    spec:
      containers:
        - name: mongo-wf-storage
          image: mongo:latest
          volumeMounts:
            - name: mongo-wf-storage-data
              mountPath: /data/db
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "subratasuperadmin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "password123"
  volumeClaimTemplates:
    - metadata:
        name: mongo-wf-storage-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
