apiVersion: batch/v1
kind: Job
metadata:
  name: httprequest-tool
  labels:
    app: httprequest-tool
spec:
  template:
    metadata:
      labels:
        app: httprequest-tool
    spec:
      containers:
      - name: httprequest-tool
        image: httprequest-tool:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Never
  backoffLimit: 3
  activeDeadlineSeconds: 300
